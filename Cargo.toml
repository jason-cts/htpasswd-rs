[package]
name = "htpasswd-rs"
version = "0.1.0"
edition = "2024"
description = "A Rust implementation of Apache htpasswd"
license = "Apache-2.0"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = "symbols"

[dependencies]
base64 = "0.23"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
crypt3_rs = { version = "0.1.1", default-features = false, features = ["apr1", "bcrypt", "bsdi", "sha2", "unix"] }
getrandom = "0.3"
rpassword = "7.4"
sha1 = "0.11"
tempfile = "3.27"
zeroize = "1.8"
