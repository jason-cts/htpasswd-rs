name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Apache htpasswd for interoperability checks
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          if [[ "${RUNNER_DEBUG:-0}" == "1" ]]; then
            sudo apt-get install -y --verbose-versions apache2-utils
          else
            sudo apt-get install -y apache2-utils
          fi
      - name: Format
        shell: bash
        run: |
          if [[ "${RUNNER_DEBUG:-0}" == "1" ]]; then
            cargo fmt --all --verbose -- --check
          else
            cargo fmt --all -- --check
          fi
      - name: Clippy
        shell: bash
        run: |
          if [[ "${RUNNER_DEBUG:-0}" == "1" ]]; then
            cargo clippy --locked --verbose --all-targets -- -D warnings
          else
            cargo clippy --locked --all-targets -- -D warnings
          fi
      - name: Test
        shell: bash
        run: |
          if [[ "${RUNNER_DEBUG:-0}" == "1" ]]; then
            cargo test --locked --verbose
          else
            cargo test --locked
          fi
